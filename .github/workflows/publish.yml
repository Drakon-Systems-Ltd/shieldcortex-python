name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  verify-version:
    # Refuse the tag before anything is built or published unless the tag,
    # pyproject.toml, src/shieldcortex/_version.py and CHANGELOG.md agree.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version and CHANGELOG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"

  publish:
    needs: verify-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
